name: Java CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java Application
      run: |
        cd SupermarketBillingSystem
        mkdir -p out
        javac -cp "lib/*" -d out \
          src/supermarket/model/*.java \
          src/supermarket/exception/*.java \
          src/supermarket/db/*.java \
          src/supermarket/dao/*.java \
          src/supermarket/service/*.java \
          src/supermarket/test/*.java \
          src/supermarket/app/*.java

    - name: Run Test Suite
      run: |
        cd SupermarketBillingSystem
        java -cp "out:lib/*" supermarket.test.SupermarketSystemTest
